name: Автосборка Music M with EXE

on:
  workflow_dispatch:
    inputs:
      namevers:
        description: "Название релиза"
        required: true
        default: "🤖 Автосборка"
      descr:
        description: "Описание релиза"
        required: true
        default: "❌ Описание сборки отсутствует"
      release:
        description: "Выкинуть в релиз?"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Пререлиз?"
        required: true
        default: true
        type: boolean

  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on:
      windows-latest # Для получения списка доступных типов раннеров
      # см. https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: "VK UI3 (Package)" # Замените на имя вашего решения, например, App1.sln.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          node-version: 16
          fetch-depth: 0

      # Декодируем закодированный в base64 pfx и сохраняем Signing_Certificate
      - name: Decode the pfx
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          $certificatePath = "${{ github.workspace }}\GitHubActionsWorkflow.pfx"
          [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

      - name: Обновить TOKEN_STAT_DEFAULT_GATE
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $content = Get-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs"
          $updatedContent = $content -replace 'Environment.GetEnvironmentVariable\("TOKEN_STAT_DEFAULT_GATE"\)', '"${{ secrets.TOKEN_STAT_DEFAULT_GATE }}"'
          Set-Content -Path "D:\a\$repoName\$repoName\VK UI3\StaticParams.cs" -Value $updatedContent
          Write-Output $updatedContent

      - name: Display disk tree
        run: |
          Get-ChildItem -Recurse | Sort-Object Length -Descending

      # Установить .NET Core
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Добавить MSBuild в PATH: https://github.com/microsoft/setup-msbuild
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Извлечь версию
        id: get_version
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $csprojPath = "D:\a\$repoName\$repoName\VK UI3\VK UI3.csproj"
          $doc = New-Object xml
          $doc.Load((Convert-Path $csprojPath))
          $version = $doc.SelectSingleNode('//AppxPackageVersion').InnerText
          echo "::set-output name=VERSION::$version"
          echo "Версия: $version"
        continue-on-error: true
        if: github.event.inputs.release == 'true'

      - name: Подставить версию в Package.appxmanifest
        run: |
          $repoName = "${{ github.repository }}".Split('/')[1]
          $csproj = "D:\a\$repoName\$repoName\VK UI3\VK UI3.csproj"
          $manifest = "D:\a\$repoName\$repoName\VK UI3 (Package)\Package.appxmanifest"
          [xml]$doc = Get-Content $csproj
          $version = $doc.SelectSingleNode('//AppxPackageVersion').InnerText.Trim()
          [xml]$xml = Get-Content $manifest
          $xml.Package.Identity.Version = $version
          $xml.Save($manifest)
        if: github.event.inputs.release == 'true'

      - name: Upload Package.appxmanifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PackageAppxManifest
          path: D:\a\Music-M\Music-M\VK UI3 (Package)\Package.appxmanifest
        if: github.event.inputs.release == 'true'

      # Восстановить приложение для заполнения папки obj RuntimeIdentifiers
      - name: Restore the application
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}
          
      - name: Clean publish directories
        run: |
          Remove-Item -Recurse -Force publish-x64, publish-x86, publish-arm64 -ErrorAction SilentlyContinue

      - name: Publish and package all architectures
        run: |
          # Настройки для разных архитектур
          $architectures = @{
            "x64"   = @{ RuntimeId = "win-x64";   OutputDir = "publish-x64" }
            "x86"   = @{ RuntimeId = "win-x86";   OutputDir = "publish-x86" }
            "arm64" = @{ RuntimeId = "win-arm64"; OutputDir = "publish-arm64" }
          }
      
          foreach ($arch in $architectures.Keys) {
            $runtimeId = $architectures[$arch].RuntimeId
            $outDir = $architectures[$arch].OutputDir
            $zipFile = "VK_UI3_$arch.zip"
            
            Write-Host "`n=== Processing $arch architecture ==="
            Write-Host "Output directory: $outDir"
            Write-Host "Zip file: $zipFile`n"
      
            # Очистка предыдущих артефактов
            try {
              if (Test-Path $outDir) {
                Remove-Item -Recurse -Force $outDir
                Write-Host "Cleaned existing directory: $outDir"
              }
              if (Test-Path $zipFile) {
                Remove-Item -Force $zipFile
                Write-Host "Removed existing zip: $zipFile"
              }
            }
            catch {
              Write-Warning "Cleanup failed: $_"
            }
      
            # Публикация с подробным логированием
            try {
              Write-Host "Starting publish for $runtimeId..."
              
              dotnet publish "VK UI3/VK UI3.csproj" `
                -c Release `
                -r $runtimeId `
                -p:PublishProfile=Unpackaged `
                -p:EnableMsixTooling=true `
                -p:WindowsPackageType=None `
                -p:SelfContained=true `
                -p:PublishSingleFile=true `
                -p:CsWinRTIIDOptimizerEnabled=false `
                -p:DebugType=embedded `
                -p:DebugSymbols=true `
                -p:CopyOutputSymbolsToOutputDirectory=false `
                -v:n `  # Подробное логирование
                -o $outDir
      
              # Проверка результатов публикации
              if (-not (Test-Path $outDir)) {
                throw "Publish directory was not created!"
              }
      
              $publishedFiles = Get-ChildItem -Path $outDir -Recurse -File
              if ($publishedFiles.Count -eq 0) {
                throw "No files were published to $outDir!"
              }
      
              Write-Host "Successfully published $($publishedFiles.Count) files"
      
              # Создание архива
              try {
                Write-Host "Creating zip archive..."
                Compress-Archive -Path "$outDir/*" -DestinationPath $zipFile -CompressionLevel Optimal
                
                if (Test-Path $zipFile) {
                  $zipSize = (Get-Item $zipFile).Length / 1MB
                  Write-Host "Created $zipFile (Size: $($zipSize.ToString('0.00')) MB)"
                } else {
                  Write-Warning "Zip file was not created!"
                }
              }
              catch {
                Write-Error "Failed to create zip: $_"
              }
            }
            catch {
              Write-Error "Publish failed for $arch`: $_"
              # Дополнительная диагностика
              Write-Host "`n=== Directory Structure ==="
              Get-ChildItem -Recurse | Where-Object { $_.FullName -match "publish|obj|bin" } | Format-Table FullName, Length
              exit 1
            }
          }

      - name: Zip x64 build
        run: |
          powershell Compress-Archive -Path publish-x64\* -DestinationPath VK_UI3_win-x64.zip

      - name: Zip x86 build
        run: |
          powershell Compress-Archive -Path publish-x86\* -DestinationPath VK_UI3_win-x86.zip

      - name: Zip arm64 build
        run: |
          powershell Compress-Archive -Path publish-arm64\* -DestinationPath VK_UI3_win-arm64.zip

      - name: Upload x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VK_UI3_win-x64
          path: VK_UI3_win-x64.zip

      - name: Upload x86 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VK_UI3_win-x86
          path: VK_UI3_win-x86.zip

      - name: Upload arm64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VK_UI3_win-arm64
          path: VK_UI3_win-arm64.zip

      - name: Upload x64 ZIP to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.TOKEN }}
          file: VK_UI3_win-x64.zip
          asset_name: VK_UI3_win-x64_${{ steps.get_version.outputs.VERSION }}.zip
          tag: ${{ steps.get_version.outputs.VERSION }}
          overwrite: true
        if: github.event.inputs.release == 'true'

      - name: Upload x86 ZIP to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.TOKEN }}
          file: VK_UI3_win-x86.zip
          asset_name: VK_UI3_win-x86_${{ steps.get_version.outputs.VERSION }}.zip
          tag: ${{ steps.get_version.outputs.VERSION }}
          overwrite: true
        if: github.event.inputs.release == 'true'

      - name: Upload arm64 ZIP to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.TOKEN }}
          file: VK_UI3_win-arm64.zip
          asset_name: VK_UI3_win-arm64_${{ steps.get_version.outputs.VERSION }}.zip
          tag: ${{ steps.get_version.outputs.VERSION }}
          overwrite: true
        if: github.event.inputs.release == 'true'
